spring:
  application:
    name: observed-app
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/observed_app}
  data:
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: decimal128

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.observeit: DEBUG
    org.hibernate.validator: ERROR
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{trace_id:-},%X{span_id:-}] [%X{order.id:-}] [%15.15t] %-40.40logger{39} : %m%n"
