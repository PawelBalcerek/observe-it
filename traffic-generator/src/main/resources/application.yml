spring:
  application:
    name: traffic-generator
  threads:
    virtual:
      enabled: true

traffic:
  observed-app-url: "http://localhost:8080"
  orders-per-second: 1.0
  workers:
    enabled: true
    concurrency: 3
    min-jitter-ms: 100
    max-jitter-ms: 500

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.observeit: DEBUG
    org.hibernate.validator: ERROR
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{trace_id:-},%X{span_id:-}] [%X{order.id:-}] [%15.15t] %-40.40logger{39} : %m%n"
