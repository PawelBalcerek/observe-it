services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: opensearch
    environment:
      - cluster.name=observe-it-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.query.datasources.encryption.masterkey=0123456789abcdef01234567
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observe-it-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    container_name: opensearch-dashboards
    command: ["opensearch-dashboards", "-c", "/usr/share/opensearch-dashboards/config/observe-it.yml"]
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    volumes:
      - ./docker/opensearch-dashboards/observe-it.yml:/usr/share/opensearch-dashboards/config/observe-it.yml:ro
    mem_limit: 512m
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - observe-it-net

  opensearch-bootstrap:
    image: opensearchproject/opensearch:3.9.0
    container_name: opensearch-bootstrap
    restart: "no"
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./docker/opensearch:/bootstrap:ro
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_started
      prometheus:
        condition: service_healthy
    networks:
      - observe-it-net

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=1d"
      - "--storage.tsdb.retention.size=256MB"
    mem_limit: 256m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - observe-it-net

  data-prepper:
    image: opensearchproject/data-prepper:2.17.1
    container_name: data-prepper
    environment:
      - "JAVA_OPTS=-Xms256m -Xmx384m"
    mem_limit: 768m
    volumes:
      - ./docker/data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./docker/data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      opensearch-bootstrap:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4900/list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observe-it-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 256m
    depends_on:
      opensearch-bootstrap:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
      data-prepper:
        condition: service_healthy
    networks:
      - observe-it-net

  mongodb:
    image: mongo:8.0.38
    container_name: mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    mem_limit: 512m
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observe-it-net

  observed-app:
    image: ${OBSERVE_IT_IMAGE_PREFIX:-ghcr.io/pawelbalcerek/observe-it}/observed-app:${OBSERVE_IT_IMAGE_TAG:-0.5.0}
    container_name: observed-app
    pull_policy: ${OBSERVE_IT_PULL_POLICY:-missing}
    mem_limit: 512m
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/observe_it
      - BPL_JVM_THREAD_COUNT=50
      - OTEL_JAVAAGENT_ENABLED=true
      - OTEL_SERVICE_NAME=observed-app
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${OBSERVE_IT_IMAGE_TAG:-0.5.0},deployment.environment.name=local
      - OTEL_SEMCONV_STABILITY_OPT_IN=database
      - OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED=false
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_BSP_SCHEDULE_DELAY=1000
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=1000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES=*
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_CODE_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES=true
    depends_on:
      otel-collector:
        condition: service_started
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/cnb/lifecycle/launcher", "--", "java", "-Dotel.javaagent.enabled=false", "-cp", "/workspace/BOOT-INF/classes:/workspace/BOOT-INF/lib/*", "com.observeit.observedapp.HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observe-it-net

  traffic-generator:
    image: ${OBSERVE_IT_IMAGE_PREFIX:-ghcr.io/pawelbalcerek/observe-it}/traffic-generator:${OBSERVE_IT_IMAGE_TAG:-0.5.0}
    container_name: traffic-generator
    pull_policy: ${OBSERVE_IT_PULL_POLICY:-missing}
    mem_limit: 512m
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - TRAFFIC_OBSERVED_APP_URL=http://observed-app:8080
      - BPL_JVM_THREAD_COUNT=50
      - OTEL_JAVAAGENT_ENABLED=true
      - OTEL_SERVICE_NAME=traffic-generator
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${OBSERVE_IT_IMAGE_TAG:-0.5.0},deployment.environment.name=local
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_BSP_SCHEDULE_DELAY=1000
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=1000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES=*
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_CODE_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES=true
    depends_on:
      otel-collector:
        condition: service_started
      observed-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/cnb/lifecycle/launcher", "--", "java", "-Dotel.javaagent.enabled=false", "-cp", "/workspace/BOOT-INF/classes:/workspace/BOOT-INF/lib/*", "com.observeit.trafficgenerator.HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observe-it-net

networks:
  observe-it-net:
    driver: bridge

volumes:
  opensearch-data:
    driver: local
  mongodb-data:
    driver: local
  prometheus-data:
    driver: local
