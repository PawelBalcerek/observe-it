name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build-cache:
        description: Build Cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
  push:
    branches:
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.build-cache == 'disabled' }}
          cache-read-only: false

      - name: Run Ktlint, Detekt, and tests
        run: ./gradlew check ${{ inputs.build-cache == 'disabled' && '--no-build-cache' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: success() || failure()
        with:
          report_paths: '**/test-results/*/*.xml'

      - name: Auto-merge Dependabot PRs
        uses: allegro-actions/dependabot-automerge@aeb9c49a533f4cdf535264da664107b0c1841b2e # v1

  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          pr-mode: false
          use-caches: ${{ inputs.build-cache != 'disabled' }}
