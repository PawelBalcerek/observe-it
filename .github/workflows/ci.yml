name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build-cache:
        description: Build Cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
  push:
    branches:
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ inputs.build-cache == 'disabled' }}
          cache-read-only: false

      - name: Run Ktlint, Detekt, and tests
        run: ./gradlew check ${{ inputs.build-cache == 'disabled' && '--no-build-cache' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        if: success() || failure()
        with:
          report_paths: '**/test-results/*/*.xml'

      - name: Auto-merge Dependabot PRs
        uses: allegro-actions/dependabot-automerge@aeb9c49a533f4cdf535264da664107b0c1841b2e # v1
