name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build-cache:
        description: Build Cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
  push:
    branches:
      - main

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ inputs.build-cache == 'disabled' }}
          cache-read-only: false

      - name: Run Ktlint, Detekt, and tests
        run: ./gradlew check ${{ inputs.build-cache == 'disabled' && '--no-build-cache' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure()
        with:
          report_paths: '**/test-results/*/*.xml'

      - name: Auto-merge Dependabot PRs
        uses: allegro-actions/dependabot-automerge@aeb9c49a533f4cdf535264da664107b0c1841b2e # v1

  storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: storefront/package.json
          cache: true
          cache_dependency_path: storefront/pnpm-lock.yaml

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Storefront dependencies
        working-directory: storefront
        run: pnpm install --frozen-lockfile

      - name: Run Biome, TypeScript, Vitest, and Vite build
        working-directory: storefront
        run: pnpm run check
