name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: 1. Validate Release Tag & Branch Ancestry
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "ERROR: Tagged commit $GITHUB_SHA is not on origin/main branch."
            exit 1
          fi
          echo "Tagged commit is verified to be on origin/main."

      - name: Verify tag matches project and Compose default versions
        id: version-check
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Tag '${TAG_NAME}' does not conform to semantic versioning (vX.Y.Z)."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          echo "Release version: ${VERSION}"

          GRADLE_VERSION="$(grep -E '^version\s*=' build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Root build.gradle.kts version: ${GRADLE_VERSION}"
          if [ "${VERSION}" != "${GRADLE_VERSION}" ]; then
            echo "ERROR: Tag version (${VERSION}) does not match root build.gradle.kts version (${GRADLE_VERSION})."
            exit 1
          fi

          COMPOSE_TAG="$(grep -E 'OBSERVE_IT_IMAGE_TAG:-' docker-compose.yml | head -n 1 | sed -E 's/.*OBSERVE_IT_IMAGE_TAG:-([0-9A-Za-z.-]+)\}.*/\1/')"
          echo "docker-compose.yml default tag: ${COMPOSE_TAG}"
          if [ "${VERSION}" != "${COMPOSE_TAG}" ]; then
            echo "ERROR: Tag version (${VERSION}) does not match docker-compose.yml default image tag (${COMPOSE_TAG})."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  quality-gates:
    name: 2. Code & Docs Quality Gates
    needs: [validate-tag]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Run Ktlint, Detekt, unit & integration tests
        run: ./gradlew check

      - name: Run documentation lint & VitePress build
        run: make docs-build

  build-images:
    name: 3. Build & Verify Native Images (${{ matrix.arch }})
    needs: [quality-gates]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      OBSERVE_IT_PULL_POLICY: never
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native container images via bootBuildImage
        run: ./gradlew bootBuildImage

      - name: Run Ktlint, Detekt, unit & integration tests before starting containers (amd64 only)
        if: matrix.arch == 'amd64'
        run: ./gradlew check

      - name: Start Docker Compose topology (amd64 only)
        if: matrix.arch == 'amd64'
        run: docker compose up -d

      - name: Run end-to-end verification suite (amd64 only)
        if: matrix.arch == 'amd64'
        run: make verify

      - name: Teardown Docker Compose topology (amd64 only)
        if: matrix.arch == 'amd64' && always()
        run: docker compose down -v

      - name: Tag and push architecture images to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_PREFIX="ghcr.io/pawelbalcerek/observe-it"

          for SERVICE in observed-app traffic-generator; do
            ARCH_TAG="sha-${SHORT_SHA}-${{ matrix.arch }}"
            docker tag "${IMAGE_PREFIX}/${SERVICE}:${VERSION}" "${IMAGE_PREFIX}/${SERVICE}:${ARCH_TAG}"
            docker push "${IMAGE_PREFIX}/${SERVICE}:${ARCH_TAG}"
          done

  merge-and-release:
    name: 4. Merge Multi-Arch Index, Attest & Publish Release
    needs: [build-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch OCI image indexes
        id: merge
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_PREFIX="ghcr.io/pawelbalcerek/observe-it"

          for SERVICE in observed-app traffic-generator; do
            echo "==> Creating multi-arch image index for ${SERVICE}..."
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/${SERVICE}:${VERSION}" \
              --tag "${IMAGE_PREFIX}/${SERVICE}:latest" \
              --tag "${IMAGE_PREFIX}/${SERVICE}:sha-${SHORT_SHA}" \
              "${IMAGE_PREFIX}/${SERVICE}:sha-${SHORT_SHA}-amd64" \
              "${IMAGE_PREFIX}/${SERVICE}:sha-${SHORT_SHA}-arm64"

            DIGEST="$(docker buildx imagetools inspect "${IMAGE_PREFIX}/${SERVICE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
              DIGEST="sha256:$(docker buildx imagetools inspect "${IMAGE_PREFIX}/${SERVICE}:${VERSION}" --raw | sha256sum | awk '{print $1}')"
            fi
            echo "${SERVICE}_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
            echo "Indexed ${SERVICE} with digest: ${DIGEST}"
          done

      - name: Attest observed-app build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pawelbalcerek/observe-it/observed-app
          subject-digest: ${{ steps.merge.outputs.observed-app_digest }}
          push-to-registry: true

      - name: Attest traffic-generator build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pawelbalcerek/observe-it/traffic-generator
          subject-digest: ${{ steps.merge.outputs.traffic-generator_digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_PREFIX="ghcr.io/pawelbalcerek/observe-it"

          NOTES_HEADER=$(cat <<EOF
          ## Container Images & Provenance Verification

          Multi-architecture (\`linux/amd64\` and \`linux/arm64\`) OCI container images are published to GitHub Container Registry (GHCR):

          ### Pull Pre-Built Container Images

          \`\`\`bash
          docker pull ${IMAGE_PREFIX}/observed-app:${VERSION}
          docker pull ${IMAGE_PREFIX}/traffic-generator:${VERSION}
          \`\`\`

          ### Run Dual-Mode Docker Compose

          Run the complete observability topology with pre-built GHCR images:

          \`\`\`bash
          docker compose up -d
          \`\`\`

          ### Verify SLSA Build Provenance

          Verify signed SLSA build provenance attestations using the GitHub CLI:

          \`\`\`bash
          gh attestation verify oci://${IMAGE_PREFIX}/observed-app:${VERSION} --owner PawelBalcerek
          gh attestation verify oci://${IMAGE_PREFIX}/traffic-generator:${VERSION} --owner PawelBalcerek
          \`\`\`
          EOF
          )

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$(echo "${NOTES_HEADER}" | sed 's/^[[:space:]]*//')"
