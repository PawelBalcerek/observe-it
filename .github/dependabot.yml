version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    ignore:
      # vitepress-plugin-mermaid peer dependency requires mermaid "10 || 11"
      - dependency-name: "mermaid"
        versions: [">= 12.0.0"]
