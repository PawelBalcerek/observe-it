complexity:
  LongMethod:
    ignoreAnnotated: ['Test', 'ParameterizedTest']
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes: ['**/test/**', '**/integration/**', '**/testFixtures/**']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test', 'ParameterizedTest']

performance:
  SpreadOperator:
    excludes: ['**/*Application.kt']

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    active: true

style:
  AbstractClassCanBeConcreteClass:
    active: false
  ForbiddenAnnotation:
    active: true
    annotations:
      - value: 'org.springframework.test.annotation.DirtiesContext'
        reason: 'Reset state in @BeforeEach/@AfterEach or assert against baseline deltas instead of rebuilding the Spring context.'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'java.lang.Thread.sleep'
        reason: 'Delay with CompletableFuture.delayedExecutor in production code and Awaitility in tests.'
      - value: 'java.lang.System.currentTimeMillis'
        reason: 'Measure elapsed time with the monotonic kotlin.time.measureTime.'
  MagicNumber:
    excludes: ['**/test/**', '**/integration/**', '**/testFixtures/**']
  UnusedParameter:
    ignoreAnnotated: ['ParameterizedTest']
